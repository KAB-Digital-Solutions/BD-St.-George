spring:
  application:
    name: saint-george-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/saint_george_db}
    username: ${SPRING_DATASOURCE_USERNAME:sgadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:change_in_production}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev_only_change_in_production_use_32_char_minimum_secret}
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.backend.auth: INFO
    com.example.backend.formengine: INFO
    com.example.backend.members: INFO
    com.example.backend.family: INFO
    com.example.backend.clergy: INFO
    com.example.backend.shared: INFO
