# Production overlay — use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: '3.9'

services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  backend:
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  # Optional: schedule pg_dump via host cron pointing at this container
  # See docs/ROADMAP.md Phase 8
