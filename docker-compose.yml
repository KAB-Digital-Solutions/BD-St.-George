# Phase 0 — database only. Run backend locally from IDE/Maven.
# Full stack (backend + frontend containers) comes in a later phase.
services:
  db:
    image: postgres:16
    container_name: saint-george-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saint_george_db}
      POSTGRES_USER: ${POSTGRES_USER:-sgadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_in_production}
    ports:
      - '5433:5432'   # host 5433 — avoids conflict with local PostgreSQL on 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgadmin -d saint_george_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
